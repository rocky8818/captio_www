# ============================================================
#  captio.tech — GitHub Actions: Deploy automático
#  Archivo: .github/workflows/deploy.yml
#
#  Secrets necesarios en tu repo (Settings → Secrets):
#    SSH_PRIVATE_KEY  → llave privada SSH (la que corresponde
#                       a la pública en /home/deploy/.ssh/authorized_keys)
#    DROPLET_IP       → IP pública de tu DigitalOcean Droplet
# ============================================================

name: Deploy a DigitalOcean

on:
  push:
    branches:
      - main   # Se activa al hacer push a main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Bajar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Build de Astro → genera carpeta /dist
      - name: Build Astro
        run: npm run build

      - name: Verificar llave
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/test_key
          chmod 600 /tmp/test_key
          ssh-keygen -l -f /tmp/test_key
          rm /tmp/test_key

      # 5. Configurar SSH
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts
          # Verificar que la llave tiene el formato correcto
          ssh-keygen -l -f ~/.ssh/id_ed25519

      # 6. Probar conexión SSH antes de rsync
      - name: Probar conexión SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            root@${{ secrets.DROPLET_IP }} \
            "echo 'SSH OK'"

      # 7. Deploy al Droplet
      - name: Deploy al Droplet
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./dist/ \
            root@${{ secrets.DROPLET_IP }}:/var/www/captio.tech/html/
